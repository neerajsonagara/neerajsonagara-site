<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'Manrope','Inter','Segoe UI',Arial,sans-serif" role="img" aria-label="Disconnected engineering, 3D document and IT/OT data are consolidated into a governed asset information foundation, which produces a Digital Twin, analytics and business value." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tealG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4C4"/><stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="slabG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F2F8F8"/>
    </linearGradient>
    <filter id="cardSh" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0A1F33" flood-opacity=".10"/>
    </filter>
    <filter id="slabSh" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0A1F33" flood-opacity=".13"/>
    </filter>
    <filter id="liftSh" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0D9488" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- ==========================================================
       LEFT COLUMN x 0-340 IS INTENTIONALLY EMPTY, FULL HEIGHT.
       The portrait goes there. Do not place artwork in it.
       All diagram content starts at x = 350.
       ========================================================== -->

  <!-- ================= 1 · DISCONNECTED SOURCES ================= -->
  <g>
    <text x="350" y="32" font-size="14" font-weight="800" letter-spacing="2.2" fill="#94A3AE">DISCONNECTED TODAY</text>
    <text x="1160" y="32" text-anchor="end" font-size="14.5" font-weight="600" fill="#5B6B7A">Same asset. Different answers.</text>

    <!-- silo 01 -->
    <g filter="url(#cardSh)">
      <rect x="350" y="56" width="250" height="104" rx="10" fill="#FFFFFF" stroke="#E4E9EE" stroke-width="1.5"/>
    </g>
    <rect x="350" y="56" width="5" height="104" rx="2.5" fill="#B9C4CC"/>
    <text x="374" y="86" font-size="13.5" font-weight="800" letter-spacing="1.2" fill="#94A3AE">01</text>
    <text x="374" y="118" font-size="19" font-weight="800" fill="#0A1F33">Engineering data</text>
    <text x="374" y="142" font-size="14" font-weight="500" fill="#5B6B7A">P&amp;IDs &#183; specs &#183; tags</text>

    <!-- silo 02 -->
    <g filter="url(#cardSh)">
      <rect x="630" y="56" width="250" height="104" rx="10" fill="#FFFFFF" stroke="#E4E9EE" stroke-width="1.5"/>
    </g>
    <rect x="630" y="56" width="5" height="104" rx="2.5" fill="#B9C4CC"/>
    <text x="654" y="86" font-size="13.5" font-weight="800" letter-spacing="1.2" fill="#94A3AE">02</text>
    <text x="654" y="118" font-size="19" font-weight="800" fill="#0A1F33">3D &amp; documents</text>
    <text x="654" y="142" font-size="14" font-weight="500" fill="#5B6B7A">models &#183; drawings</text>

    <!-- silo 04 -->
    <g filter="url(#cardSh)">
      <rect x="910" y="56" width="250" height="104" rx="10" fill="#FFFFFF" stroke="#E4E9EE" stroke-width="1.5"/>
    </g>
    <rect x="910" y="56" width="5" height="104" rx="2.5" fill="#B9C4CC"/>
    <text x="934" y="86" font-size="13.5" font-weight="800" letter-spacing="1.2" fill="#94A3AE">04</text>
    <text x="934" y="118" font-size="19" font-weight="800" fill="#0A1F33">IT / OT systems</text>
    <text x="934" y="142" font-size="14" font-weight="500" fill="#5B6B7A">SCADA &#183; DCS &#183; historians</text>
  </g>

  <!-- converging feed down into the foundation -->
  <g fill="none" stroke="url(#tealG)" stroke-width="3.2" stroke-linecap="round" opacity=".85">
    <path d="M475 168 C 475 190, 600 188, 736 202"/>
    <path d="M755 168 V 200"/>
    <path d="M1035 168 C 1035 190, 910 188, 774 202"/>
  </g>
  <path d="M740 198 l15 22 l15 -22 z" fill="#0D9488"/>

  <!-- ================= 2 · THE GOVERNED FOUNDATION ================= -->
  <g>
    <g filter="url(#slabSh)">
      <rect x="350" y="228" width="810" height="240" rx="16" fill="url(#slabG)" stroke="#0D9488" stroke-width="2"/>
    </g>
    <rect x="350" y="228" width="6" height="240" rx="3" fill="url(#tealG)"/>

    <text x="378" y="262" font-size="14" font-weight="800" letter-spacing="2.2" fill="#0D9488">THE FOUNDATION I BUILD</text>

    <!-- band 03 -->
    <rect x="378" y="278" width="378" height="98" rx="10" fill="#FFFFFF" stroke="#CFE6E3" stroke-width="1.5"/>
    <circle cx="414" cy="327" r="19" fill="url(#tealG)"/>
    <text x="414" y="334" text-anchor="middle" font-size="14.5" font-weight="800" fill="#FFFFFF">03</text>
    <text x="446" y="319" font-size="19" font-weight="800" fill="#0A1F33">Asset information</text>
    <text x="446" y="344" font-size="14" font-weight="500" fill="#5B6B7A">one class model &#183; one tag &#183; one record</text>

    <!-- band 05 -->
    <rect x="776" y="278" width="358" height="98" rx="10" fill="#FFFFFF" stroke="#CFE6E3" stroke-width="1.5"/>
    <circle cx="812" cy="327" r="19" fill="url(#tealG)"/>
    <text x="812" y="334" text-anchor="middle" font-size="14.5" font-weight="800" fill="#FFFFFF">05</text>
    <text x="844" y="319" font-size="19" font-weight="800" fill="#0A1F33">Data platform</text>
    <text x="844" y="344" font-size="14" font-weight="500" fill="#5B6B7A">pipelines &#183; contracts &#183; lineage</text>

    <!-- standards footing -->
    <text x="378" y="420" font-size="12.5" font-weight="800" letter-spacing="1.6" fill="#94A3AE">GOVERNED BY</text>
    <g font-size="13" font-weight="700" fill="#0D9488">
      <rect x="490" y="404" width="84" height="32" rx="16" fill="#E8F6F4"/><text x="532" y="425" text-anchor="middle">ISO 15926</text>
      <rect x="584" y="404" width="74" height="32" rx="16" fill="#E8F6F4"/><text x="621" y="425" text-anchor="middle">CFIHOS</text>
      <rect x="668" y="404" width="84" height="32" rx="16" fill="#E8F6F4"/><text x="710" y="425" text-anchor="middle">ISO 14224</text>
      <rect x="762" y="404" width="84" height="32" rx="16" fill="#E8F6F4"/><text x="804" y="425" text-anchor="middle">ISO 19650</text>
    </g>
    <text x="1134" y="425" text-anchor="end" font-size="14" font-weight="600" fill="#0D9488">This is the part most programs skip.</text>
  </g>

  <!-- down into the outcomes -->
  <g fill="none" stroke="url(#tealG)" stroke-width="3.2" stroke-linecap="round" opacity=".85">
    <path d="M755 468 V 504"/>
  </g>
  <path d="M740 500 l15 22 l15 -22 z" fill="#0D9488"/>

  <!-- ================= 3 · THE CONNECTED DIGITAL ASSET ================= -->
  <g>
    <text x="350" y="562" font-size="14" font-weight="800" letter-spacing="2.2" fill="#0D9488">THE CONNECTED DIGITAL ASSET</text>
    <text x="1160" y="562" text-anchor="end" font-size="14.5" font-weight="600" fill="#5B6B7A">Outcomes, not dashboards.</text>

    <!-- 06 -->
    <g filter="url(#cardSh)">
      <rect x="350" y="586" width="250" height="98" rx="10" fill="#FFFFFF" stroke="#CFE6E3" stroke-width="1.6"/>
    </g>
    <circle cx="386" cy="632" r="19" fill="#E8F6F4"/>
    <text x="386" y="639" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0D9488">06</text>
    <text x="418" y="625" font-size="19" font-weight="800" fill="#0A1F33">Digital Twin</text>
    <text x="418" y="649" font-size="14" font-weight="500" fill="#5B6B7A">the asset as it is</text>

    <!-- 07 -->
    <g filter="url(#cardSh)">
      <rect x="630" y="586" width="250" height="98" rx="10" fill="#FFFFFF" stroke="#CFE6E3" stroke-width="1.6"/>
    </g>
    <circle cx="666" cy="632" r="19" fill="#E8F6F4"/>
    <text x="666" y="639" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0D9488">07</text>
    <text x="698" y="625" font-size="19" font-weight="800" fill="#0A1F33">Analytics</text>
    <text x="698" y="649" font-size="14" font-weight="500" fill="#5B6B7A">answers in minutes</text>

    <!-- 08 -->
    <g filter="url(#liftSh)">
      <rect x="910" y="586" width="250" height="98" rx="10" fill="url(#tealG)"/>
    </g>
    <circle cx="946" cy="632" r="19" fill="#FFFFFF" fill-opacity=".22"/>
    <text x="946" y="639" text-anchor="middle" font-size="14.5" font-weight="800" fill="#FFFFFF">08</text>
    <text x="978" y="625" font-size="19" font-weight="800" fill="#FFFFFF">Business value</text>
    <text x="978" y="649" font-size="14" font-weight="500" fill="#EAFFFB">decisions people trust</text>
  </g>
</svg>
